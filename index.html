<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>美光台灣工會輿情追蹤</title>
  <meta name="description" content="美光台灣工會與勞資爭議公開新聞追蹤儀表板">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    :root { --ink:#172033; --muted:#6b7280; --line:#e6e9ef; --blue:#2855d9; --blue-soft:#eef3ff; --paper:#f7f8fb; --card:#fff; --orange:#e78435; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font:15px/1.6 system-ui,-apple-system,"Noto Sans TC",sans-serif; }
    .wrap { width:min(1180px,calc(100% - 32px)); margin:auto; }
    header { background:#111827; color:#fff; padding:44px 0 38px; }
    .eyebrow { color:#a9bdfd; font-size:12px; letter-spacing:.12em; text-transform:uppercase; }
    h1 { margin:8px 0 8px; font-size:clamp(28px,4vw,46px); letter-spacing:-.04em; }
    .lede { max-width:760px; color:#cbd5e1; margin:0; }
    main { padding:26px 0 60px; }
    .notice { background:var(--blue-soft); border:1px solid #d8e2ff; border-radius:14px; padding:14px 16px; margin-bottom:20px; color:#254194; }
    .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px; }
    .stat,.panel { background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:0 5px 18px #25304b08; }
    .stat { padding:16px; }
    .stat small { display:block; color:var(--muted); }
    .stat strong { display:block; font-size:28px; margin-top:4px; }
    .controls { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px; }
    select,input { border:1px solid #d8dde8; border-radius:9px; padding:10px 12px; background:#fff; color:var(--ink); min-height:42px; }
    input { min-width:260px; flex:1; }
    .charts { display:grid; grid-template-columns:2fr 1fr; gap:16px; margin-bottom:20px; }
    .panel { padding:18px; }
    .panel h2 { margin:0 0 14px; font-size:17px; }
    .chart-box { position:relative; height:280px; }
    .table-wrap { overflow:auto; }
    table { border-collapse:collapse; width:100%; min-width:760px; }
    th,td { text-align:left; vertical-align:top; padding:12px 10px; border-bottom:1px solid var(--line); }
    th { color:var(--muted); font-size:12px; white-space:nowrap; }
    td a { color:var(--blue); text-decoration:none; }
    td a:hover { text-decoration:underline; }
    .tag { display:inline-block; background:#f0f2f6; color:#4b5563; border-radius:999px; padding:2px 8px; margin:2px 3px 2px 0; font-size:12px; }
    .empty { color:var(--muted); padding:24px 0; }
    footer { color:var(--muted); font-size:12px; margin-top:18px; }
    @media (max-width:800px) { .stats { grid-template-columns:repeat(2,1fr); } .charts { grid-template-columns:1fr; } }
    @media (max-width:480px) { .wrap { width:min(100% - 20px,1180px); } .stats { gap:8px; } .stat { padding:12px; } .stat strong { font-size:23px; } input { min-width:100%; } }
  </style>
</head>
<body>
<header><div class="wrap">
  <div class="eyebrow">Public news intelligence dashboard</div>
  <h1>美光台灣工會輿情追蹤</h1>
  <p class="lede">追蹤公開媒體對美光台灣工會、獎金／分紅、勞資調解與可能罷工事件的報導。相同稿件轉載會標記並分開呈現，避免把媒體聲量誤算成獨立事件。</p>
</div></header>
<main class="wrap">
  <div class="notice" id="notice">資料載入中……</div>
  <section class="stats">
    <div class="stat"><small>公開新聞紀錄</small><strong id="total">—</strong></div>
    <div class="stat"><small>涵蓋日期</small><strong id="days">—</strong></div>
    <div class="stat"><small>媒體來源</small><strong id="media">—</strong></div>
    <div class="stat"><small>同稿轉載紀錄</small><strong id="syndicated">—</strong></div>
  </section>
  <div class="controls">
    <input id="search" type="search" placeholder="搜尋標題、媒體或主題……" aria-label="搜尋新聞">
    <select id="dateFilter" aria-label="依日期篩選"><option value="">全部日期</option></select>
    <select id="languageFilter" aria-label="依語言篩選"><option value="">全部語言</option></select>
    <select id="statusFilter" aria-label="依狀態篩選"><option value="">全部狀態</option></select>
  </div>
  <section class="charts">
    <div class="panel"><h2>每日報導數量</h2><div class="chart-box"><canvas id="dailyChart"></canvas></div></div>
    <div class="panel"><h2>語言分布</h2><div class="chart-box"><canvas id="languageChart"></canvas></div></div>
  </section>
  <section class="charts">
    <div class="panel"><h2>媒體來源分布</h2><div class="chart-box"><canvas id="mediaChart"></canvas></div></div>
    <div class="panel"><h2>主題分布</h2><div class="chart-box"><canvas id="topicChart"></canvas></div></div>
  </section>
  <section class="panel"><h2>公開新聞清單 <span id="resultCount" style="color:var(--muted);font-size:13px;font-weight:400"></span></h2>
    <div class="table-wrap"><table><thead><tr><th>日期</th><th>媒體</th><th>標題</th><th>語言</th><th>主題</th><th>狀態</th></tr></thead><tbody id="rows"></tbody></table></div>
    <div class="empty" id="empty" hidden>沒有符合條件的新聞。</div>
  </section>
  <footer>資料來源為公開新聞頁面；本頁不包含工會內部資料、會員資訊、郵件紀錄或自動化 secrets。最後更新：<span id="generated">—</span></footer>
</main>
<script>
let all = [], charts = {};
const $ = id => document.getElementById(id);
const colors = ['#2855d9','#e78435','#16a085','#8e5bd9','#d34c65','#1596b5','#73808f','#d1a21c'];
function countBy(items, keyFn) { return items.reduce((m,x)=>{const k=keyFn(x)||'未標示';m[k]=(m[k]||0)+1;return m;},{}); }
function values(obj) { return Object.entries(obj).sort((a,b)=>b[1]-a[1]); }
function destroy(name) { if (charts[name]) charts[name].destroy(); }
function renderCharts(items) {
  const daily = countBy(items, x=>x.published_date||'日期待確認');
  const media = countBy(items, x=>x.media);
  const language = countBy(items, x=>x.language);
  const topic = {}; items.forEach(x=>(x.topics||[]).forEach(t=>topic[t]=(topic[t]||0)+1));
  [['dailyChart', {type:'bar',data:{labels:Object.keys(daily).sort(),datasets:[{label:'篇數',data:Object.keys(daily).sort().map(k=>daily[k]),backgroundColor:'#2855d9'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}}],
   ['languageChart',{type:'doughnut',data:{labels:Object.keys(language),datasets:[{data:Object.values(language),backgroundColor:colors}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}}],
   ['mediaChart',{type:'bar',data:{labels:values(media).map(x=>x[0]).reverse(),datasets:[{label:'篇數',data:values(media).map(x=>x[1]).reverse(),backgroundColor:'#e78435'}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}}],
   ['topicChart',{type:'bar',data:{labels:values(topic).map(x=>x[0]),datasets:[{label:'篇數',data:values(topic).map(x=>x[1]),backgroundColor:'#16a085'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}}]
  ].forEach(([id,cfg])=>{destroy(id); charts[id]=new Chart($(id),cfg);});
}
function filtered() { const q=$('search').value.trim().toLowerCase(), d=$('dateFilter').value, l=$('languageFilter').value, s=$('statusFilter').value; return all.filter(x=>(!d||x.published_date===d)&&(!l||x.language===l)&&(!s||x.status===s)&&(!q||[x.title,x.media,x.language,x.status,...(x.topics||[])].join(' ').toLowerCase().includes(q))); }
function render() { const items=filtered(); $('resultCount').textContent=`（${items.length} 筆）`; $('rows').innerHTML=''; $('empty').hidden=items.length!==0; items.forEach(x=>{const tr=document.createElement('tr'); const cells=[x.published_date||'日期待確認',x.media,x.title,x.language,(x.topics||[]).map(t=>`<span class="tag">${t}</span>`).join(''),x.status]; cells.forEach((v,i)=>{const td=document.createElement('td');if(i===2){const a=document.createElement('a');a.href=x.url;a.target='_blank';a.rel='noopener';a.textContent=v;td.append(a)}else td.innerHTML=v;tr.append(td)});$('rows').append(tr)});renderCharts(items);}
async function init(){ try {const r=await fetch('data/news.json'); if(!r.ok) throw new Error('data/news.json '+r.status); const data=await r.json(); all=data.articles||[]; const dates=[...new Set(all.map(x=>x.published_date).filter(Boolean))].sort().reverse(); const media=[...new Set(all.map(x=>x.media))].sort(); const langs=[...new Set(all.map(x=>x.language))].sort(); const statuses=[...new Set(all.map(x=>x.status))].sort(); dates.forEach(x=>$('dateFilter').add(new Option(x,x))); langs.forEach(x=>$('languageFilter').add(new Option(x,x))); statuses.forEach(x=>$('statusFilter').add(new Option(x,x))); $('total').textContent=all.length; $('days').textContent=dates.length; $('media').textContent=media.length; $('syndicated').textContent=all.filter(x=>x.status==='同稿轉載').length; $('generated').textContent=data.summary?.generated_at||'—'; $('notice').textContent='公開資料儀表板：同稿轉載會標記，但不計入獨立事件判讀。'; render(); } catch(e) { $('notice').textContent='資料載入失敗：'+e.message; console.error(e); } }
['search','dateFilter','languageFilter','statusFilter'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render)); init();
</script>
</body></html>
